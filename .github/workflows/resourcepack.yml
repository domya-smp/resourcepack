name: Build and release domsmp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resourcepack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build resource pack
        run: python3 scripts/build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: domsmp
          path: dist/domsmp.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: domsmp
          path: dist

      - name: Verify downloaded archive
        working-directory: dist
        run: python3 -m zipfile --test domsmp.zip

      - name: Create and publish release
        shell: bash
        run: |
          sha1="$(sha1sum dist/domsmp.zip)"
          sha256="$(sha256sum dist/domsmp.zip)"
          printf 'SHA-1: `%s`\n\nSHA-256: `%s`\n' \
            "${sha1%% *}" "${sha256%% *}" > "$RUNNER_TEMP/release-notes.md"

          gh release create "$RELEASE_TAG" \
            dist/domsmp.zip \
            --target "$SOURCE_SHA" \
            --title "domsmp ${RELEASE_TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Add download links to summary
        shell: bash
        run: |
          base_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          {
            echo "[Download latest resource pack](${base_url}/latest/download/domsmp.zip)"
            echo
            echo "[Download this build](${base_url}/download/${RELEASE_TAG}/domsmp.zip)"
          } >> "$GITHUB_STEP_SUMMARY"
